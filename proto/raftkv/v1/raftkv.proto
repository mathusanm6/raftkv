syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/mathusanm6/raftkv/proto/raftkv/v1;raftkvv1";

// RaftKV is the client-facing cache service.
service RaftKV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
  int64 version = 3;
}

message SetRequest {
  string key = 1;
  string value = 2;
  int64 version = 3;
}

message SetResponse {}

message DeleteRequest {
  string key = 1;
  int64 version = 2;
}

message DeleteResponse {}

// LeaderHint is returned in error details when a request hits a follower.
message LeaderHint {
  string leader_id = 1;
  string leader_address = 2;
}

// RaftCommand represents an internal command replicated through Raft consensus.
message RaftCommand {
  string command_id = 1;
  oneof payload {
    SetCommand set = 2;
    DeleteCommand delete = 3;
    EvictBatchCommand evict = 4;
  }
}

message SetCommand {
  string key = 1;
  string value = 2;
  int64 version = 3;
}

message DeleteCommand {
  string key = 1;
  int64 version = 2;
}

message EvictItem {
  string key = 1;
  int64 version = 2;
}

message EvictBatchCommand {
  repeated EvictItem items = 1;
}

// SnapshotData represents the full serializable state of the cache for Raft compaction.
message SnapshotData {
  repeated SnapshotEntry entries = 1;
  repeated SnapshotTombstone tombstones = 2;
  uint64 last_applied_index = 3;
  uint64 last_applied_term = 4;
  int64 accounted_bytes = 5;
}

message SnapshotEntry {
  string key = 1;
  string value = 2;
  int64 version = 3;
  uint64 apply_index = 4;
}

message SnapshotTombstone {
  string key = 1;
  int64 version = 2;
}
