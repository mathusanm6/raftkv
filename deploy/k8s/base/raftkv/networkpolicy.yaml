apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: raftkv-network-policy
spec:
  podSelector:
    matchLabels:
      app: raftkv
  policyTypes:
    - Ingress
  ingress:
    # Port 9001: Raft consensus traffic only permitted from fellow raftkv pods
    - from:
        - podSelector:
            matchLabels:
              app: raftkv
      ports:
        - protocol: TCP
          port: 9001

    # Port 9000 & 8080: Accessible from load generator and monitoring
    - ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8080
