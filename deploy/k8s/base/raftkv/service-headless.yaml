apiVersion: v1
kind: Service
metadata:
  name: raftkv-headless
  labels:
    app: raftkv
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 9000
      name: grpc-client
    - port: 9001
      name: grpc-raft
    - port: 8080
      name: http-mgmt
  selector:
    app: raftkv
